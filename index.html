<style>
/* RESET */
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 0;
}

/* CONTAINER */
.container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  min-height: 500px;
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 20px;
}
.logo {
  width: 70px;
}

/* STEP */
.step {
  display: none;
  opacity: 0;
  transform: translateX(30px);
  transition: all 0.35s ease;
}
.step.active {
  display: block;
  opacity: 1;
  transform: translateX(0);
}
.step.back {
  transform: translateX(0px);
}

/* FORM */
label {
  font-weight: bold;
  display: block;
  margin-bottom: 8px;
}
input, select, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px; /* penting agar mobile tidak auto zoom */
}

/* BUTTON */
.buttons {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}
button {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}
.next {
  background: #4f46e5;
  color: white;
}
.prev {
  background: #e5e7eb;
}
.next:hover { background: #4338ca; }
.prev:hover { background: #d1d5db; }

/* RESULT */
.result {
  text-align: center;
}
.success { color: green; }
.error { color: red; }
.summary {
  text-align: left;
  margin-top: 20px;
  font-size: 15px;
}

/* ========================= */
/* 📱 MOBILE FULL SCREEN */
/* ========================= */
@media (max-width: 600px) {
  body {
    background: white;
  }

  .container {
    max-width: 100%;
    margin: 0;
    min-height: 100vh;
    border-radius: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .header h2 {
    font-size: 20px;
  }

  .header p {
    font-size: 14px;
  }

  button {
    font-size: 17px;
  }
}

/* ========================= */
/* 🔄 LOADING SPINNER */
/* ========================= */
.loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.9);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading p {
  margin-top: 15px;
  font-size: 16px;
  color: #374151;
}

.spinner {
  width: 45px;
  height: 45px;
  border: 4px solid #e5e7eb;
  border-top: 4px solid #4f46e5;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0); }
  100% { transform: rotate(360deg); }
}

.hidden {
  display: none;
}

/* ========================= */
/* 📌 FOOTER */
/* ========================= */
.footer {
  text-align: center;
  font-size: 13px;
  color: #6b7280;
  padding: 15px 10px;
}

/* Mobile: footer tetap di bawah */
@media (max-width: 600px) {
  .footer {
    font-size: 12px;
    padding-bottom: env(safe-area-inset-bottom);
  }
}

</style>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzetZusvc8W9j8rf-cyVb_V1rpB7VaPjwcbECAxALornrv-V2VoUkNuF92qbl_PIsI_Mw/exec';

let currentStep = 0;
const steps = document.querySelectorAll('.step');
const form = document.getElementById('surveyForm');
const result = document.getElementById('result');
let savedData = {};

function showStep(index, direction = 'next') {
  steps.forEach(step => step.classList.remove('active', 'back'));

  if (direction === 'back') {
    steps[index].classList.add('back');
  }

  steps[index].classList.add('active');
}

function nextStep() {
  const inputs = steps[currentStep].querySelectorAll('input, select, textarea');
  for (let input of inputs) {
    if (!input.checkValidity()) {
      input.reportValidity();
      return;
    }
  }
  currentStep++;
  showStep(currentStep, 'next');
}

function prevStep() {
  currentStep--;
  showStep(currentStep, 'back');
}

const loading = document.getElementById('loadingOverlay');

form.addEventListener('submit', async e => {
  e.preventDefault();

  savedData = Object.fromEntries(new FormData(form).entries());

  // TAMPILKAN SPINNER
  loading.classList.remove('hidden');

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(savedData)
    });

    const json = await res.json();

    // HILANGKAN SPINNER
    loading.classList.add('hidden');

    if (json.status === 'success') {
      showSuccess();
    } else {
      showError();
    }

  } catch (error) {
    // HILANGKAN SPINNER
    loading.classList.add('hidden');
    showError();
  }
});


function showSuccess() {
  form.style.display = 'none';
  result.style.display = 'block';
  result.className = 'result success';
  result.innerHTML = `
    <h3>Terima kasih 🙏</h3>
    <p>Data berhasil dikirim.</p>

    <div class="summary">
      <b>Nama Ananda :</b> ${savedData.q1}<br>
      <b>Nama Orang Tua/Wali :</b> ${savedData.q2}<br>
      <b>NO. HP/Wa Orang Tua/Wal :</b> ${savedData.q3}<br>
      <b>dan seterusnya, silahkan di download jika ingin melihat data anda.<br><p>
    </div>

    <button class="next" onclick="downloadDoc()">Download Hasil (.doc)</button>
  `;
}

function showError() {
  result.style.display = 'block';
  result.className = 'result error';
  result.innerHTML = `
    <h3>Terjadi Masalah ⚠️</h3>
    <p>Silakan refresh dan coba lagi.</p>
  `;
}

function downloadDoc() {
  const text = `
Data Observasi

Nama Ananda : ${savedData.q1}
Nama Orang Tua/Wali : ${savedData.q2}
NO. HP/Wa Orang Tua/Wal : ${savedData.q3}
Darimana Ayah/Bunda tahu mengenai Penerimaan Santri Baru di TK SWASTA IT SUNNAH AN-NAJAH ? : ${savedData.q4}
Apa yang melatar belakangi Ayah/Bunda memilih TK SWASTA IT SUNNAH AN-NAJAH sebagai sekolah untuk Ananda? : ${savedData.q5}
Dengan memilih TK SWASTA IT SUNNAH AN-NAJAH sebagai sekolah Ananda, apa harapan Ayah/Bunda? : ${savedData.q6}
Bagaimana Ayah/Bunda menanamkan TAUHID kepada Ananda? : ${savedData.q7}
